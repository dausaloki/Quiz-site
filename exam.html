<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Test | कलम से क्रांति</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#08152f;--card:#172d57;--gold:#e7c85e;--blue:#8ec5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:'Noto Sans Devanagari',sans-serif}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid #49699e;border-radius:16px;padding:18px;margin:12px 0}.brand{color:var(--gold);font-size:23px;font-weight:800}.muted{color:#b7c5df}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--gold);font:inherit;font-weight:800;margin:4px;color:#15213d}.ghost{background:transparent;border:1px solid #83baff;color:#fff}.opts{display:grid;gap:10px}.opt{padding:13px;border:1px solid #607aa7;border-radius:10px;background:#0c1d3d;color:white;text-align:left;font:inherit}.opt.sel{border:2px solid var(--gold);background:#294779}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.grid button{padding:9px 0;border-radius:7px;border:1px solid #7890b7;background:#10264d;color:#fff}.grid button.done{background:#237a5b}.grid button.star{outline:2px solid var(--gold)}.hidden{display:none!important}.stat{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--blue)}h2{color:var(--gold)}
</style></head><body><main class="wrap"><div class="brand">✍️ कलम से क्रांति ✍️</div><div id="loading" class="card">टेस्ट लोड हो रहा है…</div><section id="intro" class="card hidden"><h2 id="title"></h2><p id="info" class="muted"></p><label>विद्यार्थी का नाम</label><input id="student" style="width:100%;padding:12px;border-radius:9px;margin:8px 0" placeholder="अपना नाम लिखें"><button class="btn" id="start">टेस्ट शुरू करें</button></section>
<section id="paper" class="hidden"><div class="card stat"><b id="counter"></b><b>समय: <span id="timer"></span></b></div><div class="card"><div id="question"></div><div id="options" class="opts"></div><p><button class="btn ghost" id="star">☆ Review</button></p><div class="stat"><button class="btn ghost" id="prev">Previous</button><button class="btn" id="next">Save & Next</button><button class="btn ghost" id="submit">Submit</button></div></div><div class="card"><b>Question Palette</b><div id="palette" class="grid"></div></div></section>
<section id="result" class="card hidden"><h2>आपका Result</h2><div id="summary"></div><button class="btn" onclick="location.href='index.html'">होम पेज</button><button class="btn ghost" onclick="location.reload()">Retake</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.PORTAL_CONFIG||{},$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let sb=null,test=null,answers=[],stars=[],cur=0,seconds=0,interval=null,started=0,finished=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){['loading','intro','paper','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
async function init(){if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('loading').textContent='Cloud config नहीं है। README_HI.md देखें।';return}sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);if(!id){$('loading').textContent='Test ID नहीं मिला।';return}let {data,error}=await sb.from('portal_tests').select('id,title,duration_minutes,seconds_per_question,marks_per_question,negative_marks,questions,question_count').eq('id',id).eq('is_published',true).single();if(error||!data){$('loading').textContent='टेस्ट उपलब्ध नहीं है: '+(error?.message||'');return}test=data;answers=Array(test.questions.length).fill(-1);stars=Array(test.questions.length).fill(false);$('title').textContent=test.title;$('info').textContent=test.question_count+' प्रश्न • '+test.duration_minutes+' मिनट • सही उत्तर '+test.marks_per_question+' अंक';show('intro')}
$('start').onclick=()=>{if(!$('student').value.trim())return alert('अपना नाम लिखें');started=Date.now();seconds=test.duration_minutes*60;show('paper');render();interval=setInterval(()=>{seconds--;clock();if(seconds<=0){submit();return}if(test.seconds_per_question>0){qSeconds--;if(qSeconds<=0){if(cur<answers.length-1){cur++;render()}else submit()}}},1000);clock()};
function clock(){$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')+(test?.seconds_per_question>0?' | प्रश्न: '+qSeconds+'s':'')}
function render(){qSeconds=Number(test.seconds_per_question||0);$('counter').textContent='प्रश्न '+(cur+1)+' / '+test.questions.length;$('question').innerHTML='<h2>प्रश्न '+(cur+1)+'</h2><p>'+esc(test.questions[cur].question)+'</p>';$('options').innerHTML=test.questions[cur].options.map((o,i)=>'<button class="opt '+(answers[cur]===i?'sel':'')+'" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');$('options').querySelectorAll('button').forEach(b=>b.onclick=()=>{answers[cur]=+b.dataset.i;render()});$('star').textContent=stars[cur]?'★ Marked for Review':'☆ Mark for Review';$('palette').innerHTML=answers.map((a,i)=>'<button class="'+(a>=0?'done ':'')+(stars[i]?'star':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');$('palette').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});$('prev').disabled=cur===0;$('next').textContent=cur===answers.length-1?'आखिरी प्रश्न':'Save & Next'}
$('star').onclick=()=>{stars[cur]=!stars[cur];render()};$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur<answers.length-1){cur++;render()}else submit()};$('submit').onclick=()=>{if(confirm('क्या आप टेस्ट जमा करना चाहते हैं?'))submit()};
async function submit(){if(finished)return;finished=true;clearInterval(interval);let correct=0,attempted=0;answers.forEach((a,i)=>{if(a>=0){attempted++;if(a===Number(test.questions[i].correct_index))correct++}});let wrong=attempted-correct,marks=correct*Number(test.marks_per_question||1)-wrong*Number(test.negative_marks||0),pct=(marks/(test.questions.length*Number(test.marks_per_question||1))*100);let elapsed=Math.round((Date.now()-started)/1000),name=$('student').value.trim();$('summary').innerHTML='<p>विद्यार्थी: <b>'+esc(name)+'</b></p><p>अंक: <b>'+marks+'</b> / '+(test.questions.length*Number(test.marks_per_question||1))+'</p><p>सही: '+correct+' | गलत: '+wrong+' | छोड़े: '+(answers.length-attempted)+'</p><p>प्रतिशत: '+pct.toFixed(2)+'% | समय: '+elapsed+' सेकंड</p>';show('result');try{let {error}=await sb.from('portal_results').insert({test_id:test.id,test_title:test.title,student_name:name,marks,percentage:Number(pct.toFixed(2)),correct_count:correct,wrong_count:wrong,unattempted_count:answers.length-attempted,time_seconds:elapsed});if(error)console.warn(error.message)}catch(e){console.warn(e)}}
init();
</script></body></html>
